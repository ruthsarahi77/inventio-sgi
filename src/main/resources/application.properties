spring.application.name=inventio
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.sql.init.mode=never
# JWT propio: clave obligatoria, Base64 de al menos 32 bytes aleatorios.
inventio.jwt.secret=${JWT_SECRET:}
inventio.jwt.issuer=${JWT_ISSUER:inventio-api}
inventio.jwt.audience=${JWT_AUDIENCE:inventio-clients}
inventio.jwt.ttl-seconds=${JWT_TTL_SECONDS:900}
inventio.bootstrap.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}